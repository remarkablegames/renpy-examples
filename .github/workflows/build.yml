name: build
on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Ren'Py
        uses: remarkablegames/setup-renpy@v1
        with:
          cli-version: 8.4.1
          web: true

      - name: Set version
        run: sed -i -e 's/1.0.0-alpha/${{ github.sha }}/g' game/options.rpy

      - name: Delete unnecessary files
        run: >
          find .
          ! -name "progressive_download.txt"
          ! -name "web-presplash.*"
          ! -path "*/.*"
          ! -path "*game*"
          -delete

      - name: Build web
        run: renpy-launcher web_build . --destination web

      - name: Update presplash image
        run: |
          rm web/web-presplash.jpg
          mv web-presplash.webp web
          grep -lr web-presplash.jpg | xargs sed -i 's/web-presplash.jpg/web-presplash.webp/g'

      - name: Deploy site
        if: github.ref_name == 'master'
        uses: remarkablemark/gitploy-action@v1
        with:
          directory: web

      - name: Upload artifacts
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v4
        with:
          name: web_build
          path: web
