name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ren'Py
        uses: remarkablegames/setup-renpy@v2
        with:
          cli-version: 8.5.2
          web: true

      - name: Set version
        run: sed -i -e 's/1.0.0-alpha/${{ github.sha }}/g' game/options.rpy

      - name: Delete unnecessary files
        run: >
          find . -type f
          ! -path '*/.*'
          ! -path './game/*'
          ! -path './icon.*'
          ! -path './progressive_download.txt'
          ! -path './web-*'
          -delete

      # build first so web artifacts are not included
      - name: Build desktop distributions
        if: github.event_name == 'workflow_dispatch'
        run: renpy-launcher distribute . --dest ../dists

      - name: Build web
        run: renpy-launcher web_build . --destination web

      - name: Page test
        uses: remarkablemark/page-test-action@v1
        with:
          url: http://localhost:8000
          start: python -m http.server --directory web
          wait-on: http://localhost:8000

      - name: Google Analytics
        uses: remarkablemark/google-analytics-action@v1
        with:
          html-path: web/index.html
          measurement-id: ${{ secrets.GOOGLE_ANALYTICS_ID }}

      - name: Deploy site
        if: github.event_name != 'workflow_dispatch' && github.ref_name == 'master'
        uses: remarkablemark/gitploy-action@v1
        with:
          directory: web

      - name: Prepare distribution artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir artifact
          cp ../dists/*-win.zip artifact
          cp ../dists/*-linux.tar.bz2 artifact
          cp ../dists/*-mac.zip artifact
          cp -R web artifact

      - name: Upload distribution artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: artifact
