name: build
on: [push, pull_request]

permissions:
  contents: write

env:
  WEB_BUILD_DEST: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ren'Py
        uses: remarkablegames/setup-renpy@v2
        with:
          cli-version: 8.5.1
          web: true

      - name: Set version
        run: sed -i -e 's/1.0.0-alpha/${{ github.sha }}/g' game/options.rpy

      - name: Delete unnecessary files
        run: >
          find .
          ! -name "progressive_download.txt"
          ! -name "web-presplash.*"
          ! -path "*/.*"
          ! -path "*game*"
          -delete

      - name: Build web
        run: renpy-launcher web_build . --destination $WEB_BUILD_DEST

      - name: Deploy site
        if: github.ref_name == 'master'
        uses: remarkablemark/gitploy-action@v1
        with:
          directory: ${{ env.WEB_BUILD_DEST }}

      - name: Upload artifacts
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v6
        with:
          name: web_build
          path: ${{ env.WEB_BUILD_DEST }}
